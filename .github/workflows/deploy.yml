# CD — deploy on merge.
#
# On push to main, the self-hosted homelab runner builds the frontend then deploys the app
# NATIVELY to waterfast-243 by running petedio-iac's tested play `configure-water-fast.yml`.
# Same shape as petedio-palworld-panel's and petedio-resume-builder's deploy.yml: mint creds
# via GitHub OIDC → Vault, run ansible in Docker, pass secrets as an `-e @file` (never on
# argv, never logged).
#
# The frontend build runs on the RUNNER, before the ansible/Docker step — not inside that
# container. The container bind-mounts this checkout read-only (`/src:ro`), and the play only
# ever COPIES frontend/dist/ to the target; it never builds it. Building here, on the same
# filesystem the read-only mount points at, means frontend/dist/ already exists by the time
# the mount is taken. (The play asserts dist/index.html exists and fails the deploy if not,
# so a missed build is caught rather than silently serving 404s.)
#
# This is the SAME play the operator validates by hand via
# petedio-iac/scripts/deploy-water-fast.sh — the runner just runs it on merge.
#
# Runs ONLY on push to main (never on PRs): PR-controlled code must never touch the
# self-hosted runner, which sits inside the LAN. Requires the `water-fast-cd` Vault OIDC
# role (petedio-iac vault-config); without it the vault-action login 403s.
name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-water-fast # serialize deploys against LXC 243
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # mint the GitHub OIDC token vault-action exchanges for a Vault token

env:
  ANSIBLE_IMAGE: python:3.12-slim

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, homelab] # inside the LAN — can reach 243
    steps:
      - name: Checkout app (source to deploy)
        uses: actions/checkout@v6
        with:
          path: app

      - name: Checkout petedio-iac (ansible play + inventory)
        uses: actions/checkout@v6
        with:
          repository: PeteDio-Labs/petedio-iac
          ref: main
          path: iac

      - uses: oven-sh/setup-bun@v2

      # `bun run build` runs `tsc --noEmit` first, so this also fails on any drift between
      # shared/types.ts and either side of the wire — the deploy stops before it touches 243.
      - name: Build frontend
        working-directory: app/frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Encode Vault CA
        id: vault_ca
        working-directory: iac/environments/homelab
        run: echo "b64=$(base64 -w0 vault-ca.crt)" >> "$GITHUB_OUTPUT"

      - name: Vault — SSH key + app secrets via OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: https://192.168.50.223:8200
          method: jwt
          path: jwt-github # non-default mount — must be explicit or Vault 403s
          role: water-fast-cd
          jwtGithubAudience: https://github.com/PeteDio-Labs
          caCertificate: ${{ steps.vault_ca.outputs.b64 }}
          exportEnv: true
          secrets: |
            kv/data/iac/lxc-ssh private_key | ANSIBLE_SSH_KEY ;
            kv/data/services/water-fast db_password | WF_DB_PASSWORD ;
            kv/data/services/water-fast cf_access_team_domain | WF_CF_TEAM_DOMAIN ;
            kv/data/services/water-fast cf_access_aud | WF_CF_AUD

      - name: Deploy to waterfast-243 (ansible in Docker)
        shell: bash
        run: |
          umask 077
          CI="/tmp/ci-water-fast"
          rm -rf "$CI"; mkdir -p "$CI"
          trap 'rm -rf "$CI"' EXIT
          printf '%s\n' "$ANSIBLE_SSH_KEY" > "$CI/key"; chmod 600 "$CI/key"
          # Secret + path extra-vars via a JSON @file — never on argv, never logged.
          python3 - "$CI/evars.json" <<'PY'
          import json, os, sys
          ev = {
              "ansible_ssh_private_key_file": "/ci/key",
              "waterfast_db_password": os.environ["WF_DB_PASSWORD"],
              "waterfast_cf_access_team_domain": os.environ["WF_CF_TEAM_DOMAIN"],
              "waterfast_cf_access_aud": os.environ["WF_CF_AUD"],
              "waterfast_src": "/src",
          }
          json.dump(ev, open(sys.argv[1], "w"))
          PY
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/iac/ansible:/ansible" \
            -v "$GITHUB_WORKSPACE/app:/src:ro" \
            -v "$CI:/ci:ro" -w /ansible \
            -e ANSIBLE_HOST_KEY_CHECKING=False \
            -e ANSIBLE_TRANSFORM_INVALID_GROUP_CHARS=ignore \
            "$ANSIBLE_IMAGE" sh -c \
            "apt-get update -q >/dev/null && apt-get install -y -q openssh-client rsync >/dev/null && \
             pip install -q ansible-core && \
             ansible-galaxy collection install community.general ansible.posix && \
             ansible-playbook -i inventory/hosts.yml playbooks/configure-water-fast.yml -e @/ci/evars.json"
