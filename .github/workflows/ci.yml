name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # The backend suite runs against a real Postgres rather than a mock: the one-active-fast
    # partial unique index, the ownership-scoped queries and the numeric-to-number coercion
    # only exist in the database, so mocking it would test nothing that can actually break.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: waterfast_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Backend tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:55432/waterfast_test
        run: bun test

      - name: Backend typecheck
        working-directory: backend
        run: bun run typecheck

      # `bun run build` runs `tsc --noEmit` first, so this also fails on any drift between
      # shared/types.ts and either side of the wire.
      - name: Frontend build
        working-directory: frontend
        run: bun run build
